version: '3'

tasks:
  default:
    desc: Show available tasks
    cmds:
      - task --list

  build:
    desc: Build the library
    cmds:
      - cargo build --all-features

  check:
    desc: cargo check on all targets
    cmds:
      - cargo check --all-targets --all-features

  fmt:
    desc: Format all code
    cmds:
      - cargo fmt --all

  fmt:check:
    desc: Verify formatting
    cmds:
      - cargo fmt --all -- --check

  clippy:
    desc: Run clippy with warnings as errors
    cmds:
      - cargo clippy --all-targets --all-features -- -W clippy::nursery -D warnings

  test:
    desc: Run all tests
    cmds:
      - cargo test --all-features

  doc:
    desc: Build docs (errors-as-warnings)
    cmds:
      - RUSTDOCFLAGS="-D warnings" cargo doc --no-deps --all-features

  audit:
    desc: Security audit of dependencies
    cmds:
      - cargo audit

  deny:
    desc: Run cargo deny checks
    cmds:
      - cargo deny check

  changelog:check:
    desc: Verify every released tag has its own CHANGELOG section
    # The release pipeline generates GitHub notes from git (`changelog.use: git`)
    # and never touches CHANGELOG.md, so nothing but this closes the section
    # for a version that just shipped. Without it entries pile up under
    # [Unreleased] release after release, unattributable once the memory fades.
    cmds:
      - |
        set -eu
        missing=
        for tag in $(git tag --merged HEAD --list 'v*'); do
          grep -qF "## [${tag#v}]" CHANGELOG.md || missing="$missing $tag"
        done
        if [ -n "$missing" ]; then
          echo "CHANGELOG.md has no section for:$missing" >&2
          echo "Move the shipped entries out of [Unreleased] into '## [x.y.z] - YYYY-MM-DD'." >&2
          exit 1
        fi

  ci:
    desc: Full local CI sweep (fmt, clippy, test, audit, deny, doc)
    cmds:
      - task: fmt:check
      - task: clippy
      - task: test
      - task: changelog:check
      - task: audit
      - task: deny
      - task: doc

  commit:
    desc: Run the pre-commit chain (fmt + clippy + test) then commit. Pass commit args via --.
    cmds:
      - task: fmt
      - task: clippy
      - task: test
      - git commit {{.CLI_ARGS}}
