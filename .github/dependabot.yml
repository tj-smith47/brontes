version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "saturday"
    # Skip day-zero releases: a dep bumped this week is not re-bumped next
    # week when its follow-up patch ships.
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore"
      include: "scope"
    # Group routine version bumps into one weekly PR; Dependabot security
    # updates bypass grouping and arrive as individual PRs regardless.
    groups:
      cargo:
        patterns: ["*"]
      # Security updates ignore the schedule and arrive on advisory day; this
      # group folds them into one PR per ecosystem instead of one per dep.
      cargo-security:
        applies-to: security-updates
        patterns: ["*"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "saturday"
    # Skip day-zero releases: a dep bumped this week is not re-bumped next
    # week when its follow-up patch ships.
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      github-actions:
        patterns: ["*"]
      # Security updates ignore the schedule and arrive on advisory day; this
      # group folds them into one PR per ecosystem instead of one per dep.
      github-actions-security:
        applies-to: security-updates
        patterns: ["*"]
    ignore:
      # Self-managed: the floating @v1 is moved by anodizer-action's own
      # release (semantic-release + update-major-tag). Don't let Dependabot
      # track it; a v2 cutover is a deliberate manual bump.
      - dependency-name: "tj-smith47/anodizer-action"
