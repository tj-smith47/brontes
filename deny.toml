# cargo-deny config. Permissive on advisories during scaffold; tightened phase by phase.

[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "warn"

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "Unicode-3.0",
    # MPL-2.0 is file-level copyleft and safe to consume from a permissive
    # binary; pulled in transitively via `dirs` -> `option-ext`.
    "MPL-2.0",
]
confidence-threshold = 0.93

[bans]
multiple-versions = "warn"
wildcards = "deny"

# Duplicates that cannot be collapsed without forking an upstream crate.
# Each entry justifies WHY the dup exists and WHY no unifying version is
# reachable.
skip = [
    # `getrandom` 0.2.x vs 0.4.x
    # 0.2: pulled in by `ring 0.17` (the rustls TLS backend).
    # 0.4: pulled in by `rand`, `tempfile`, `uuid` (all current).
    # No unifying version exists: `ring` ships its own crypto and its
    # release cadence is glacial — moving off `getrandom 0.2` needs a new
    # `ring` release outside brontes' control. Re-evaluate when
    # `ring >= 0.18` lands.
    { name = "getrandom", version = "0.2" },

    # `base64` 0.22.x vs 0.23.x
    # 0.22: pulled in by `hyper-util` and `reqwest`.
    # 0.23: pulled in by `rmcp 3`.
    # Both are current releases of their own dependents, so there is no
    # version of either that resolves onto the other. Re-evaluate when
    # `hyper-util` and `reqwest` move to `base64 0.23`.
    { name = "base64", version = "0.22" },

    # `syn` 2.x vs 3.x
    # 2.x: held by `clap_derive`, `darling` (via `rmcp-macros`), `displaydoc`,
    #      `schemars_derive`, `tokio-macros`, and the rest of the proc-macro
    #      layer under them.
    # 3.x: already adopted by `serde_derive`, `async-trait`, `ref-cast-impl`.
    # This is the ecosystem mid-migration; the split closes as the remaining
    # proc-macro crates cut releases on `syn 3`. Both are compile-time only.
    { name = "syn", version = "2" },
]

[sources]
unknown-registry = "deny"
unknown-git = "warn"
