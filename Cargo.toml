[package]
name = "brontes"
version = "0.4.0"
edition = "2024"
rust-version = "1.94"
description = "Turn any clap CLI into an MCP server. Supports MCP 2026-07-28."
authors = ["TJ Smith"]
license = "MIT"
repository = "https://github.com/tj-smith47/brontes"
homepage = "https://github.com/tj-smith47/brontes"
documentation = "https://docs.rs/brontes"
readme = "README.md"
keywords = ["cli", "clap", "mcp", "ai", "server"]
categories = [
    "command-line-interface",
    "development-tools",
    "api-bindings",
    "web-programming::http-server",
]
# Keep the published .crate tarball lean: developer-only configuration,
# release scaffolding, and CI workflows do not belong in consumer crates.
exclude = [
    ".github/",
    ".claude/",
    ".cargo/",
    "scripts/",
    ".gitignore",
    ".anodizer.yaml",
    "Taskfile.yml",
    "clippy.toml",
    "deny.toml",
    "rustfmt.toml",
    "rust-toolchain.toml",
]

[lib]
name = "brontes"
path = "src/lib.rs"

[dependencies]
clap = { version = "4.5", features = ["derive", "string", "wrap_help"] }
rmcp = { version = "3.0", features = [
    "server",
    "transport-io",
    "transport-streamable-http-server",
    "schemars",
] }
schemars = "1.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = [
    "macros",
    "rt-multi-thread",
    "signal",
    "process",
    "io-util",
    "io-std",
    "sync",
    "net",
    "time",
] }
tokio-util = { version = "0.7", features = ["rt"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"
async-trait = "0.1"
futures = "0.3"
tempfile = "3"
# Per-OS home/config directory resolution for editor-config file paths
# (Claude Desktop / VSCode / Cursor under `manager/paths.rs`). The
# documented Rust analog of Go's `os.UserHomeDir()` — used as the home
# resolver; an unresolved home triggers the per-row fallback chain
# in `manager/paths.rs`.
dirs = "6"
# HTTP runtime for the `mcp stream` streamable-HTTP transport. The rmcp
# `StreamableHttpService` is `tower_service::Service<Request<Incoming>>`;
# we wire it directly to hyper's per-connection serve loop and use
# `hyper-util::TokioIo` to bridge tokio AsyncRead/AsyncWrite to hyper's
# IO traits. Axum would also work but pulls ~50 transitive deps; the
# direct hyper path costs ~5.
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "server"] }
http-body-util = "0.1"
# `StreamableHttpService` only implements `tower_service::Service`; we
# call it directly without the heavier `tower` builder layers.
tower-service = "0.3"

[features]
default = []
# Forward `rmcp/request-state` and re-export `RequestStateCodec`, for middleware
# that puts meaningful state in an MRTR `requestState` and therefore has to
# verify its integrity when the client echoes it back.
request-state = ["rmcp/request-state"]

[dev-dependencies]
pretty_assertions = "1"
tokio = { version = "1", features = ["full"] }
rmcp = { version = "3.0", features = [
    "server",
    "client",
    "transport-io",
    "transport-streamable-http-server",
    "schemars",
    # The MRTR round-trip tests need a client peer that can declare the
    # elicitation capability and answer an elicitation request.
    "elicitation",
    "request-state",
] }
# Smoke-test the streamable-HTTP transport by POSTing real HTTP/1.1 to a
# bound port. `reqwest` is rmcp's chosen smoke-test client and is already
# present in its dev-dep graph.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# A task handle is a bearer token, so the handle-security tests assert its
# shape and entropy directly. Same crate rmcp mints them with, so the
# assertions read against the real generator rather than a re-implementation.
uuid = { version = "1", features = ["v4"] }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[[test]]
name = "trace_propagation_e2e"
# The binary is both the MCP server and the CLI brontes spawns as its child
# (`current_exe` inside an integration test is the test binary), so it needs to
# own `main` and dispatch on argv rather than run under libtest.
harness = false

[[test]]
name = "task_cancel_e2e"
# Same reason as `trace_propagation_e2e`: the binary is both the MCP server and
# the child process whose death under `tasks/cancel` is the thing being proven.
harness = false

[[example]]
name = "make-mcp"
path = "examples/make-mcp/main.rs"
